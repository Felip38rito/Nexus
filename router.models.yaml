# Model Router — configuração de modelos (tiers → modelos + providers).
#
# Este arquivo define QUAIS modelos cada tier aponta, QUAIS providers existem,
# e os thresholds do classificador. Edite aqui e reinicie o router (ou aponte
# para outro arquivo via ROUTER_MODELS_YAML no .env).
#
# IMPORTANTE: use os API ids REAIS do /v1/models (sem sufixo ":cloud" — esse é
# alias do Hermes e daria 404 na API).

# Tier padrão quando o classificador falha ou não decide.
default_tier: air

# Providers disponíveis. Cada provider tem um base_url (endpoint OpenAI-compatível)
# e o nome da env var que guarda a chave daquele provider.
# Se você não definir este bloco, um provider "default" (Ollama Cloud) é usado
# e todos os tiers apontam para ele.
providers:
  default:
    base_url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
  # Provider local (Ollama rodando na máquina) — usado pelo classificador leve.
  # O Ollama local ignora o header Authorization, então a chave é irrelevante.
  local:
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
  # Exemplo: um segundo provider (descomente para usar).
  # gemini:
  #   base_url: https://generativelanguage.googleapis.com/v1beta
  #   api_key_env: GEMINI_API_KEY

# Opcional: name = alias de exibição/roteamento (aparece no /v1/models).
# Opcional: description = override do prompt do classificador para este tier.
#   Se ausente, usa a descrição embutida.
tiers:
  mini:
    model: gemma4:31b
    description: "fast/cheap - discussion + trivial/mechanical tasks"
  air:
    model: deepseek-v4-flash:0731
    description: "default - day-to-day implementation"
  pro:
    model: deepseek-v4-pro:0813
    description: "raw coding power, hard debugging/refactors"
  ultra:
    model: kimi-k3
    description: "deep synthesis, whole-architecture, adversarial analysis"

# Classificador.
# - model: modelo usado na decisão qualitativa (JSON). É o decisor PRIMÁRIO.
# - provider: qual provider serve o classificador (default: "default").
# - min_classify_len: prompts menores que isso = chatter trivial (mini).
classifier:
  model: gemma4:31b
  provider: default
  min_classify_len: 10
