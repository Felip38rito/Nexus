# Model Router — configuração de modelos (tiers → modelos da Ollama Cloud).
#
# Este arquivo define QUAIS modelos cada tier aponta e os thresholds do
# classificador. Edite aqui e reinicie o router (ou aponte para outro arquivo
# via ROUTER_MODELS_YAML no .env).
#
# IMPORTANTE: use os API ids REAIS do /v1/models (sem sufixo ":cloud" — esse é
# alias do Hermes e daria 404 na API).

# Tier padrão quando o classificador falha ou não decide.
default_tier: air

# Tiers fixos (mini/air/pro/pro-max). Cada tier tem o modelo e uma descrição.
tiers:
  mini:
    model: gemma4:31b
    description: "fast/cheap - discussion + trivial/mechanical tasks"
  air:
    model: deepseek-v4-flash:0731
    description: "default - day-to-day implementation"
  pro:
    model: glm-5.2
    description: "frontier reasoning, complex/ambiguous design"
  pro-max:
    model: deepseek-v4-pro:0813
    description: "raw coding power, hard debugging/refactors"

# Classificador.
# - classifier_model: modelo usado na decisão qualitativa (JSON). É o decisor
#   PRIMÁRIO — a decisão de tier é qualitativa, não keyword-matching.
# - min_classify_len: prompts menores que isso = chatter trivial (mini). Só
#   pega saudações/curtos; prompts técnicos curtos vão pro LLM decidir.
classifier:
  model: gemma4:31b
  min_classify_len: 10
