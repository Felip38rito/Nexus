[project]
name = "axon"
version = "0.1.0"
description = "Local OpenAI-compatible proxy that routes each request to the cheapest adequate Ollama Cloud model."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.27.2",
  "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
axon = "axon_cli.main:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
